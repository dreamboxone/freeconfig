name: Update Top 30 Configs
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Download XTLS Xray-core
        run: |
          wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          
      - name: Run Real Xray URL test script
        run: python update.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add sub.txt sub_base64.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "🚀 Auto Update: Top 30 Configs (Real Xray Core)"
          git push
